<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Ayşegül 3D Heart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 100vw; 
      height: 100vh; 
      background: radial-gradient(circle, #2b020d 0%, #050002 100%); 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-family: 'Arial', sans-serif; 
      touch-action: none; 
      transition: background 0.5s ease;
    }
    #canvas-container { width: 100%; height: 100%; }
    
    /* Zarif Birlikte Geçen Zaman Sayacı */
    #counter-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 230, 230, 0.9);
      font-size: 14px;
      letter-spacing: 1.5px;
      text-align: center;
      background: rgba(255, 0, 40, 0.08);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 100, 120, 0.2);
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(150, 0, 30, 0.3);
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="counter-container">Birlikte: <span id="timer">Yükleniyor...</span></div>

  <script>
    // --- 1. ZAMAN SAYACI (26 Eylül 2026) ---
    const startDate = new Date('2026-09-26T00:00:00');

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      if (diff < 0) {
        const absDiff = Math.abs(diff);
        const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((absDiff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((absDiff / 1000 / 60) % 60);
        const seconds = Math.floor((absDiff / 1000) % 60);
        document.getElementById('timer').innerText = `${days} Gün ${hours} Saat Kaldı`;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('timer').innerText = `${days} Gün ${hours} Saat ${minutes} Dk ${seconds} Sn`;
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    // --- 2. THREE.JS SAHNE KURULUMU ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 21;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Arka Plan Işıltıları / Yıldız Efekti
    const starGeo = new THREE.BufferGeometry();
    const starCount = 600;
    const posArr = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) posArr[i] = (Math.random() - 0.5) * 60;
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.12, color: 0xffb3c1, transparent: true, opacity: 0.35 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // Kırmızı Temalı Yüksek Kaliteli Yazı Üretici
