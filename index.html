<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>iyi ki benimsin </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 100vw; 
      height: 100vh; 
      background: radial-gradient(circle, #3d1422 0%, #17080f 100%); 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-family: 'Arial', sans-serif; 
      touch-action: none; 
      transition: background 0.8s ease;
    }
    #canvas-container { width: 100%; height: 100%; }
    
    #counter-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 240, 245, 0.9);
      font-size: 14px;
      letter-spacing: 1.5px;
      text-align: center;
      background: rgba(255, 77, 109, 0.12);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 150, 170, 0.25);
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(100, 20, 40, 0.3);
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="counter-container">Birlikte: <span id="timer">Yükleniyor...</span></div>

  <script>
    // --- 1. ZAMAN SAYACI (26 Eylül 2026) ---
    const startDate = new Date('2026-09-26T00:00:00');

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      if (diff < 0) {
        const absDiff = Math.abs(diff);
        const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((absDiff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((absDiff / 1000 / 60) % 60);
        const seconds = Math.floor((absDiff / 1000) % 60);
        document.getElementById('timer').innerText = `${days} Gün ${hours} Saat Kaldı`;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('timer').innerText = `${days} Gün ${hours} Saat ${minutes} Dk ${seconds} Sn`;
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    // --- 2. THREE.JS SAHNE KURULUMU ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 21;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Soft Arka Plan Yıldızları
    const starGeo = new THREE.BufferGeometry();
    const starCount = 400;
    const posArr = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) posArr[i] = (Math.random() - 0.5) * 60;
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.12, color: 0xffccd5, transparent: true, opacity: 0.4 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // Yazı Üretici
    function createTextTexture(text, colorStr, glowColor, fontSize = 65) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024; 
      canvas.height = 256;

      ctx.font = `Bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 35;
      }
      ctx.fillStyle = colorStr;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      return texture;
    }

    const texAysegul = createTextTexture('Ayşegül', '#ffffff', '#ff1744', 65);
    const texLove = createTextTexture('I love you', '#ffffff', '#ff4081', 65);

    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    const materials = [];

    // Dış Yüzey Kalp Noktaları
    for (let i = 0; i < 2500; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);
      
      const mat = new THREE.MeshBasicMaterial({ 
        map: Math.random() > 0.5 ? texAysegul : texLove, 
        transparent: true, 
        opacity: 0.9, 
        color: new THREE.Color(0xff2a55),
        side: THREE.FrontSide 
      });
      materials.push(mat);

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.5), mat);
      mesh.position.set(x * 0.38, y * 0.38, z * 0.38);
      mesh.lookAt(mesh.position.clone().multiplyScalar(2));
      heartGroup.add(mesh);
    }

    // İç Dolgu Kalp Noktaları
    for (let i = 0; i < 1500; i++) {
      const u = Math.PI * (2 * Math.random() - 1);
      const v = (Math.PI / 2) * (2 * Math.random() - 1);
      const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
      const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * Math.cos(v);
      const z = 6 * Math.sin(v);
      
      const internalScale = Math.random() * 0.85;
      const mat = new THREE.MeshBasicMaterial({ 
        map: Math.random() > 0.5 ? texAysegul : texLove, 
        transparent: true, 
        opacity: 0.65, 
        color: new THREE.Color(0xd90429),
        side: THREE.FrontSide 
      });
      materials.push(mat);

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4), mat);
      mesh.position.set(x * 0.38 * internalScale, y * 0.38 * internalScale, z * 0.38 * internalScale);
      mesh.rotation.y = Math.random() * Math.PI;
      heartGroup.add(mesh);
    }

    // --- 3. DAHA ZARİF VE GERÇEKÇİ KELEBEKLER ---
    function createButterflyTexture() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 256; canvas.height = 256;

      // Soft Parlama
      ctx.shadowColor = '#ff85a1';
      ctx.shadowBlur = 12;

      // Üst Kanatlar (Daha kavisli ve zarif)
      ctx.fillStyle = '#ffb3c6';
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.bezierCurveTo(70, 70, 20, 90, 40, 40);
      ctx.bezierCurveTo(60, 20, 110, 60, 128, 128);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.bezierCurveTo(186, 70, 236, 90, 216, 40);
      ctx.bezierCurveTo(196, 20, 146, 60, 128, 128);
      ctx.fill();

      // Alt Kanatlar
      ctx.fillStyle = '#ffccd5';
      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.bezierCurveTo(60, 140, 30, 180, 60, 200);
      ctx.bezierCurveTo(90, 210, 110, 160, 128, 128);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(128, 128);
      ctx.bezierCurveTo(196, 140, 226, 180, 196, 200);
      ctx.bezierCurveTo(166, 210, 146, 160, 128, 128);
      ctx.fill();

      // İnce Zarif Gövde
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(128, 128, 3, 35, 0, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    const butterflyTex = createButterflyTexture();
    const butterflies = [];
    const butterflyCount = 18;

    for (let i = 0; i < butterflyCount; i++) {
      const mat = new THREE.MeshBasicMaterial({
        map: butterflyTex,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), mat);
      
      mesh.position.set(
        (Math.random() - 0.5) * 35,
        (Math.random() - 0.5) * 35,
        (Math.random() - 0.5) * 20
      );

      scene.add(mesh);
      butterflies.push({
        mesh,
        speedX: (Math.random() - 0.5) * 0.02,
        speedY: Math.random() * 0.015 + 0.008,
        speedZ: (Math.random() - 0.5) * 0.015,
        wingSpeed: Math.random() * 0.12 + 0.08,
        wingAngle: Math.random() * Math.PI,
        floatSpeed: Math.random() * 0.02 + 0.01
      });
    }

    // --- 4. DOKUNMA VE SÜRÜKLEME KONTROLLERİ ---
    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let targetScale = 1.0;

    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      previousPointerPosition = { x: e.clientX, y: e.clientY };
      targetScale = 1.15;
    });

    window.addEventListener('pointerup', () => { isDragging = false; targetScale = 1.0; });
    window.addEventListener('pointercancel', () => { isDragging = false; targetScale = 1.0; });
    
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      heartGroup.rotation.y += (e.clientX - previousPointerPosition.x) * 0.008;
      heartGroup.rotation.x += (e.clientY - previousPointerPosition.y) * 0.005;
      previousPointerPosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('wheel', (e) => {
      camera.position.z += e.deltaY * 0.015;
      camera.position.z = Math.max(10, Math.min(35, camera.position.z));
    }, { passive: true });

    // --- 5. ANİMASYON VE RENK GEÇİŞLERİ ---
    let colorTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      
      if (!isDragging) {
        heartGroup.rotation.y += 0.004;
      }

      heartGroup.scale.x += (targetScale - heartGroup.scale.x) * 0.1;
      heartGroup.scale.y += (targetScale - heartGroup.scale.y) * 0.1;
      heartGroup.scale.z += (targetScale - heartGroup.scale.z) * 0.1;

      // Akıcı Renk Geçişleri
      colorTime += 0.005;
      const r = 0.88 + Math.sin(colorTime) * 0.12;
      const g = 0.15 + Math.sin(colorTime + 1) * 0.1;
      const b = 0.35 + Math.cos(colorTime * 0.8) * 0.15;

      for (let i = 0; i < materials.length; i++) {
        materials[i].color.setRGB(r, g, b);
      }

      // Soft Arka Plan Ton Geçişi
      const bgR = Math.floor(50 + Math.sin(colorTime * 0.4) * 15);
      const bgG = Math.floor(18 + Math.sin(colorTime * 0.4) * 5);
      const bgB = Math.floor(32 + Math.cos(colorTime * 0.4) * 10);
      document.body.style.background = `radial-gradient(circle, rgb(${bgR}, ${bgG}, ${bgB}) 0%, rgb(18, 6, 12) 100%)`;

      // Kelebeklerin Doğal Salınım ve Kanat Çırpma Hareketi
      butterflies.forEach((b, index) => {
        b.mesh.position.x += b.speedX + Math.sin(colorTime + index) * 0.01;
        b.mesh.position.y += b.speedY;
        b.mesh.position.z += b.speedZ;

        b.wingAngle += b.wingSpeed;
        b.mesh.scale.x = Math.sin(b.wingAngle) * 0.9; // Daha yumuşak kanat çırpma

        if (b.mesh.position.y > 20) b.mesh.position.y = -20;
        if (b.mesh.position.x > 22) b.mesh.position.x = -22;
        if (b.mesh.position.x < -22) b.mesh.position.x = 22;
      });

      stars.rotation.y += 0.0002;
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
